[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-resume-agent"
version = "1.0.0"
description = "面向面试官的 RAG 简历助手 Agent"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AI Resume Agent Team" }
]
keywords = ["rag", "resume", "agent", "fastapi", "qdrant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# 与 backend/requirements.txt 保持一致；开发安装可直接用 pip install -e .
dependencies = [
    "qdrant-client>=1.19",
    "fastembed>=0.8",
    "rank-bm25>=0.2",
    "python-docx>=1.1",
    "pypdf>=5.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "openai>=1.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "langgraph>=0.2",
    "langchain-core>=0.3",
]

[project.urls]
Homepage = "https://github.com/yourname/ai-resume-agent"
Repository = "https://github.com/yourname/ai-resume-agent"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
exclude = [".test*", "deploy.online*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
